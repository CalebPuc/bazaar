name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew test --no-daemon
